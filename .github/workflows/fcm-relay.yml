name: FCM Order Status Relay

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  relay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: تثبيت الحزم
        run: npm install

      - name: تشغيل الفحص وإرسال الإشعارات
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node relay.js
